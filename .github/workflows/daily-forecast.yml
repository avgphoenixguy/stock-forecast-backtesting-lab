name: Daily OHLC refresh and forecast

on:
  schedule:
    # 20:00 India Standard Time, weekdays, after the regular cash-market close.
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ohlc-forecast
  cancel-in-progress: false

jobs:
  refresh-and-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run project tests
        run: python -m pytest -q

      - name: Refresh and validate adjusted daily OHLC
        run: python scripts/download_data.py --ticker RELIANCE.NS

      - name: Score previous forecasts and create the next-session forecast
        run: python scripts/run_daily_forecast.py --ticker RELIANCE.NS --max-staleness-days 7

      - name: Commit dashboard forecast outputs when changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/daily_forecast_history_RELIANCE_NS.csv dashboard/data/latest_forecast_RELIANCE_NS.json
          if git diff --cached --quiet; then
            echo "No new market session or forecast history changes; nothing to commit."
          else
            git commit -m "Update daily RELIANCE forecast history"
            git push origin HEAD:main
          fi
