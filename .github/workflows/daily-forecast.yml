name: Daily OHLC refresh and forecast

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-forecast.yml"
      - "scripts/download_data.py"
      - "scripts/run_daily_forecast.py"
      - "scripts/update_nifty500_universe.py"
      - "requirements.txt"
      - "requirements-forecast.txt"
  schedule:
    # 20:45 India Standard Time, weekdays, offset from common GitHub cron peak times.
    - cron: "15 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ohlc-forecast
  cancel-in-progress: false

jobs:
  refresh-and-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-forecast.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-forecast.txt

      - name: Run project tests
        run: python -m pytest -q

      - name: Refresh official Nifty 500 searchable directory
        run: python scripts/update_nifty500_universe.py

      - name: Refresh and validate adjusted daily OHLC
        run: python scripts/download_data.py --ticker RELIANCE.NS

      - name: Score previous forecasts and create multi-model next-session forecasts
        run: python scripts/run_daily_forecast.py --ticker RELIANCE.NS --max-staleness-days 7 --include-deep-learning

      - name: Commit dashboard forecast outputs when changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/daily_forecast_history_RELIANCE_NS.csv dashboard/data/latest_forecast_RELIANCE_NS.json dashboard/data/price_history_RELIANCE_NS.csv dashboard/data/nifty500_universe.csv
          if git diff --cached --quiet; then
            echo "No new market session or forecast history changes; nothing to commit."
          else
            git commit -m "Update daily RELIANCE forecast history"
            # The app or README may be updated while this job is running.
            # Rebase the generated data commit onto the latest main before pushing.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
